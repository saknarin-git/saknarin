name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BOOTSTRAP_ADMIN_TOKEN: ${{ secrets.BOOTSTRAP_ADMIN_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: zpknotoujmvkeqeoqgyf
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install Supabase CLI
        run: npm install --global supabase@latest

      - name: Sync Supabase secrets
        run: supabase secrets set BOOTSTRAP_ADMIN_TOKEN="$BOOTSTRAP_ADMIN_TOKEN" --project-ref "$PROJECT_REF"

      - name: Push database migrations
        shell: bash
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "SUPABASE_DB_PASSWORD is not set, skipping database migrations."
            exit 0
          fi

          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --include-all

      - name: Deploy public functions
        run: |
          supabase functions deploy member-search --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy auth-register --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy auth-login --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy bootstrap-admin --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy protected functions
        run: |
          supabase functions deploy user-profile --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy admin-users --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy admin-records --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy system-overview --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy loan-workspace --project-ref "$PROJECT_REF" --no-verify-jwt
